<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaziantep Güneşi - Menü</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f4f9; color: #333; padding-bottom: 30px; }
        
        header { background: linear-gradient(135deg, #8b0000, #4a0000); color: white; text-align: center; padding: 25px 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        header h1 { font-size: 24px; margin-bottom: 5px; font-weight: 700; }
        header p { font-size: 14px; opacity: 0.9; }

        .categories-container { position: sticky; top: 0; background: white; padding: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); z-index: 100; overflow-x: auto; white-space: nowrap; display: flex; gap: 8px; }
        .categories-container::-webkit-scrollbar { display: none; }
        
        .cat-btn { background: #e0e0e0; border: none; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; color: #444; cursor: pointer; transition: 0.3s; }
        .cat-btn.active { background: #8b0000; color: white; }

        .container { max-width: 650px; margin: 20px auto; padding: 0 15px; }
        
        .category-title { font-size: 20px; color: #8b0000; margin: 25px 0 12px 0; border-bottom: 2px solid #8b0000; padding-bottom: 5px; }

        .menu-item { background: white; border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; justify-content: space-between; align-items: center; }
        .item-details { flex: 1; padding-right: 15px; }
        .item-name { font-weight: 700; font-size: 16px; color: #222; }
        .item-desc { font-size: 13px; color: #666; margin-top: 4px; line-height: 1.3; }
        .item-price { font-weight: 700; font-size: 16px; color: #8b0000; white-space: nowrap; background: #fff0f0; padding: 6px 12px; border-radius: 8px; }

        #loading { text-align: center; padding: 50px; font-size: 16px; color: #666; }

        /* Kale NFC Alt Bilgi İmzası */
        .footer-signature {
            text-align: center;
            padding: 20px 10px 10px;
            font-size: 12px;
            color: #888888;
            border-top: 1px solid #e0e0e0;
            margin-top: 30px;
        }
        .footer-signature strong { color: #8b0000; }
    </style>
</head>
<body>

    <header>
        <h1>Gaziantep Güneşi</h1>
        <p>Geleneksel Kebap & Pide Salonu</p>
    </header>

    <div class="categories-container" id="categories"></div>

    <div class="container">
        <div id="loading">Menü yükleniyor...</div>
        <div id="menu-list"></div>

        <!-- Kale NFC İmzası -->
        <div class="footer-signature">
            Altyapı & Tasarım: <strong>Kale NFC Dijital Çözümler</strong>
        </div>
    </div>

    <script>
        const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRdBf4T4LC93QiPfrDAPSU855JIGx6XRgVkHDTSosx4XaPDPoMkGiguk1omg56CIAz_CPa3zfWeHaYZ/pub?output=csv';

        // CSV Ayrıştırma Fonksiyonu (Virgüllü içerikleri düzgün okur)
        function parseCSVLine(text) {
            let result = [];
            let entry = '';
            let inQuotes = false;
            for (let c of text) {
                if (c === '"') {
                    inQuotes = !inQuotes;
                } else if (c === ',' && !inQuotes) {
                    result.push(entry.trim().replace(/^"|"$/g, ''));
                    entry = '';
                } else {
                    entry += c;
                }
            }
            result.push(entry.trim().replace(/^"|"$/g, ''));
            return result;
        }

        async function fetchMenu() {
            try {
                const res = await fetch(sheetURL);
                const csvText = await res.text();
                
                const rawLines = csvText.split(/\r?\n/);
                const menuList = document.getElementById('menu-list');
                const categoriesContainer = document.getElementById('categories');
                const loading = document.getElementById('loading');

                loading.style.display = 'none';
                menuList.innerHTML = '';
                categoriesContainer.innerHTML = '';

                let dataByCat = {};

                for (let i = 1; i < rawLines.length; i++) {
                    if (!rawLines[i].trim()) continue;
                    
                    let columns = parseCSVLine(rawLines[i]);
                    if (columns.length >= 2) {
                        let cat = columns[0];
                        let name = columns[1];
                        let desc = columns[2] || '';
                        let price = columns[3] || '';

                        if (!cat || !name) continue;

                        if (!dataByCat[cat]) dataByCat[cat] = [];
                        dataByCat[cat].push({ name, desc, price });
                    }
                }

                Object.keys(dataByCat).forEach((cat, index) => {
                    const btn = document.createElement('button');
                    btn.className = `cat-btn ${index === 0 ? 'active' : ''}`;
                    btn.innerText = cat;
                    btn.onclick = () => {
                        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        document.getElementById(`cat-${index}`)?.scrollIntoView({ behavior: 'smooth' });
                    };
                    categoriesContainer.appendChild(btn);

                    const section = document.createElement('div');
                    section.id = `cat-${index}`;
                    
                    let html = `<h2 class="category-title">${cat}</h2>`;
                    dataByCat[cat].forEach(item => {
                        let formattedPrice = item.price;
                        if (formattedPrice && !formattedPrice.toUpperCase().includes('TL')) {
                            formattedPrice += ' TL';
                        }

                        html += `
                            <div class="menu-item">
                                <div class="item-details">
                                    <div class="item-name">${item.name}</div>
                                    ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
                                </div>
                                ${item.price ? `<div class="item-price">${formattedPrice}</div>` : ''}
                            </div>
                        `;
                    });
                    section.innerHTML = html;
                    menuList.appendChild(section);
                });

            } catch (err) {
                console.error(err);
                document.getElementById('loading').innerText = 'Menü yüklenirken bir hata oluştu.';
            }
        }

        fetchMenu();
    </script>
</body>
</html>
